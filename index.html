<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quran Companion — رفيقك في حفظ القرآن الكريم ومراجعته" />
    <meta name="theme-color" content="#0f3d34" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://api.alquran.cloud" />
    <link rel="preconnect" href="https://everyayah.com" />
    <title>Quran Companion</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('qc:settings') || '{}');
        var dark = s.theme ? s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (s.lang === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" onerror="window.__QC_SRC_FAILED = true"></script>
    <!-- source-fallback:start (removed automatically from builds) -->
    <script>
      // This is the SOURCE entry file; it only runs under the Vite dev server (npm run dev).
      // Opened any other way — double-clicked from disk, or uploaded as-is to GitHub Pages /
      // Netlify / any static host — the browser can't run /src/main.jsx. In that case open the
      // ready-built single-file app (QuranCompanion.html) that sits next to this file.
      (function () {
        var isDev = !!document.querySelector('script[src^="/@vite/client"]');
        function openBuilt() {
          if (window.__QC_BOOTED || isDev || /QuranCompanion\.html$/.test(location.pathname)) return false;
          location.replace('QuranCompanion.html' + location.hash);
          return true;
        }
        if (location.protocol === 'file:') { openBuilt(); return; }
        // On a website: switch as soon as the script fails to load…
        var tries = 0;
        var t = setInterval(function () {
          tries++;
          if (window.__QC_BOOTED || isDev) return clearInterval(t);
          if (window.__QC_SRC_FAILED || tries > 30) { clearInterval(t); if (!openBuilt()) showHelp(); }
        }, 100);
        function showHelp() {
          var r = document.getElementById('root');
          if (!r || r.childElementCount) return;
          r.innerHTML =
            '<div style="max-width:620px;margin:12vh auto;padding:24px;font:16px/1.7 system-ui,sans-serif;color:#1c2522;background:#fff;border:1px solid #e4ddcd;border-radius:16px" dir="ltr">' +
            '<h1 style="margin:0 0 8px;font-size:22px">Quran Companion could not start</h1>' +
            '<p>The app script failed to load. Check the browser console (F12) for details.</p></div>';
        }
      })();
    </script>
    <!-- source-fallback:end -->
  </body>
</html>
